<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林小憩 - 老師匿名空間</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f7f0] min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-[2rem] shadow-xl border border-stone-200">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-[#4a5d23]">🌲 森林小憩</h1>
            <p class="text-xs text-stone-500 mt-1">給老師的匿名心情樹洞</p>
        </header>
        
        <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
            <button onclick="setMood('🌱 希望')" class="flex-shrink-0 px-4 py-1 rounded-full border border-stone-200 text-sm hover:bg-green-50">🌱 希望</button>
            <button onclick="setMood('☁️ 壓力')" class="flex-shrink-0 px-4 py-1 rounded-full border border-stone-200 text-sm hover:bg-green-50">☁️ 壓力</button>
            <button onclick="setMood('🍂 疲憊')" class="flex-shrink-0 px-4 py-1 rounded-full border border-stone-200 text-sm hover:bg-green-50">🍂 疲憊</button>
            <button onclick="setMood('🌙 靜謐')" class="flex-shrink-0 px-4 py-1 rounded-full border border-stone-200 text-sm hover:bg-green-50">🌙 靜謐</button>
        </div>

        <textarea id="msg" class="w-full p-4 bg-stone-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-[#87986a]" rows="4" placeholder="今天在學校還好嗎？寫下來吧..."></textarea>
        
        <button onclick="publish()" class="w-full bg-[#718355] text-white py-3 rounded-full mt-4 font-bold shadow-lg hover:bg-[#4a5d23] transition">
            送出日記
        </button>

        <div class="mt-8">
            <h2 class="text-sm font-bold text-stone-400 mb-4 border-b pb-2">最近的心情日記</h2>
            <div id="wall" class="space-y-4">
                <p class="text-center text-stone-300 text-sm py-4">目前還沒有日記，你是第一個唷！</p>
            </div>
        </div>
    </div>

    <script>
        let currentMood = "🌱 希望";
        function setMood(m) { currentMood = m; alert("已選擇：" + m); }

        function publish() {
            const txt = document.getElementById('msg').value;
            if(!txt) return alert("請輸入內容");
            
            const wall = document.getElementById('wall');
            if(wall.innerHTML.includes("目前還沒有日記")) wall.innerHTML = "";

            const div = document.createElement('div');
            div.className = "p-4 bg-stone-50 rounded-2xl border border-stone-100 shadow-sm";
            div.innerHTML = `<div class="flex justify-between mb-2"><span class="text-[10px] bg-white px-2 py-0.5 rounded-full border border-stone-200">${currentMood}</span><span class="text-[10px] text-stone-400">匿名老師</span></div><p class="text-stone-700 text-sm leading-relaxed">${txt}</p>`;
            
            wall.prepend(div);
            document.getElementById('msg').value = "";
        }
    </script>
</body>
</html>
